<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasketBall Counter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div>
            <h3 id="teamHome">TEAM 1</h3>
            <div class="scoreboard">
                <div id="scoreHome"></div>
            </div>
            <div class="btn-container">
                <button onclick="addOnePointHome()">+1</button>
                <button onclick="addTwoPointHome()">+2</button>
                <button onclick="addThreePointHome()">+3</button>
            </div>
        </div>
        <div>
            <h3 id="teamGuest">TEAM 2</h3>
            <div class="scoreboard">
                <div id="scoreGuest"></div>
            </div>
             <div class="btn-container">
                <button onclick="addOnePointGuest()">+1</button>
                <button onclick="addTwoPointGuest()">+2</button>
                <button onclick="addThreePointGuest()">+3</button>
            </div>
        </div>
        <button id="newGame-el" onclick="startnew()">New Game</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
